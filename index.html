<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginPage" class="login-card">
  <div class="logo">📺</div>
  <h1>IPTV Player</h1>

  <p class="subtitle">
    Inicia sesión con tu servidor Xtream
  </p>

  <input id="host" placeholder="🌐 Servidor">
  <input id="user" placeholder="👤 Usuario">
  <input id="pass" type="password" placeholder="🔒 Contraseña">

  <button id="connectBtn">Conectar</button>
</div>

<div id="homePage" style="display:none;">

  <aside class="sidebar">
    <h2>📺 IPTV</h2>

    <button>📺 TV en vivo</button>
    <button>🎬 Películas</button>
    <button>📂 Series</button>
    <button>⭐ Favoritos</button>
    <button>⚙️ Ajustes</button>
  </aside>

  <main class="content">

    <h1>Bienvenido</h1>

    <video controls width="100%"></video>

    <div class="channels">

      <div class="channel">
        Canal 1
      </div>

      <div class="channel">
        Canal 2
      </div>

      <div class="channel">
        Canal 3
      </div>

    </div>

  </main>

</div>

<script src="app.js"></script>

</body>
</html>
